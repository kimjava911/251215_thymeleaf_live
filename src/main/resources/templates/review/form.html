<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageName})}"></head>
<body>
    <nav th:replace="~{fragments/nav :: nav(${pageName})}"></nav>

    <!-- 에러 메시지 -->
    <p th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <!--  form  -->
    <form th:action="@{/reviews}"
          th:object="${review}"
          method="post"
          enctype="multipart/form-data">
        <p>
            <input th:field="*{title}" placeholder="제목">
            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </p>
        <p>
            <input th:field="*{content}" placeholder="내용">
            <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
        </p>
        <p>
            <select th:field="*{rating}">
                <option value="">선택하세요</option>
                <!-- 시작, 끝 모두 포함 (#numbers.sequence) -->
                <option th:each="i : ${#numbers.sequence(1, 5)}"
                        th:value="${i}"
                        th:text="${i} + '점'"></option>
            </select>
            <p th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></p>
        </p>
        <p>
            <input type="file" id="imageFile" name="imageFile"
                accept="image/jpeg,image/png,image/gif,image/webp">
        </p>
        <p>
            <button>등록</button>
            <a th:href="@{/reviews}">취소</a>
        </p>
    </form>
</body>
</html>
